<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gauth</title>
  <script src="https://cdn.jsdelivr.net/gh/muffinisgoated/jsdelivrrr@main/uv/uv.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/muffinisgoated/jsdelivrrr@main/uv/uv.config.js"></script>
  <script type="module">
    import * as BareMux from "https://cdn.jsdelivr.net/gh/muffinisgoated/jsdelivrrr@main/uv/stuff/baremux/index.mjs";
    window.BareMux = BareMux;
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="frame"></iframe>
  <script>
    const TARGET_URL = "https://www.gauthmath.com/";
    const WISP_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "https://cdn.jsdelivr.net/gh/muffinisgoated/jsdelivrrr@main/wisp/";
    const BASE_PATH = "https://cdn.jsdelivr.net/gh/muffinisgoated/jsdelivrrr@main/uv/";

    async function init() {
      await new Promise((res, rej) => {
        let tries = 0;
        const check = () => {
          if (typeof __uv$config !== 'undefined') return res();
          if (++tries > 50) return rej(new Error("uv failed to load"));
          setTimeout(check, 100);
        };
        check();
      });

      await new Promise((res, rej) => {
        let tries = 0;
        const check = () => {
          if (window.BareMux) return res();
          if (++tries > 50) return rej(new Error("BareMux failed to load"));
          setTimeout(check, 100);
        };
        check();
      });

      const conn = new window.BareMux.BareMuxConnection(BASE_PATH + "stuff/baremux/worker.js");
      await conn.setTransport(BASE_PATH + "stuff/epoxy/index.mjs", [{ wisp: WISP_URL }]);

      if ('serviceWorker' in navigator) {
        await navigator.serviceWorker.register(BASE_PATH + 'sw.js', { scope: BASE_PATH });
        await navigator.serviceWorker.ready;
      }

      document.getElementById('frame').src = __uv$config.prefix + __uv$config.encodeUrl(TARGET_URL);
    }

    init();
  </script>
  <script>
    const frame = document.getElementById('frame');

    frame.onload = () =>
      frame.contentDocument?.addEventListener('keydown', e => {
        document.dispatchEvent(new KeyboardEvent('keydown', {
          key: e.key,
          code: e.code,
          shiftKey: e.shiftKey,
          ctrlKey: e.ctrlKey,
          metaKey: e.metaKey,
          altKey: e.altKey,
          bubbles: true
        }));
      });
  </script>
</body>
</html>
