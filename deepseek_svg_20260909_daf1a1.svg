      <stop offset="0%" stop-color="#080d0b"/>
      <stop offset="100%" stop-color="#0f1a15"/>
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e34c26"/>
      <stop offset="100%" stop-color="#f06529"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7df1e"/>
      <stop offset="100%" stop-color="#f0db4f"/>
    </linearGradient>
    <linearGradient id="cssGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#264de4"/>
      <stop offset="100%" stop-color="#2965f1"/>
    </linearGradient>
    <linearGradient id="jsonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#f7c948"/>
